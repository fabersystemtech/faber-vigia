name: Vigía

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub puede demorarlo unos minutos)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar un mensaje de prueba a Telegram"
        type: boolean
        default: false
      simulacro:
        description: "Enviar un aviso de caída de ejemplo (para ver cómo se ve)"
        type: boolean
        default: false

# Una sola revisión a la vez; si una demora, la siguiente espera.
concurrency:
  group: vigia
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # El estado (cuántas fallas lleva cada sitio) vive en la caché de Actions, no en el repositorio público.
      - uses: actions/cache@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Revisar
        env:
          SITIOS: ${{ secrets.SITIOS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          PRUEBA: ${{ inputs.prueba && '1' || '0' }}
          SIMULACRO: ${{ inputs.simulacro && '1' || '0' }}
        run: node vigia.mjs
